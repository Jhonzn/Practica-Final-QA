# Ambiente de pruebas de seguridad (Persona 3).
#
# Levanta NodeBB 4.16.7 (imagen oficial, misma versión que el código de nodebb/NodeBB),
# MongoDB 7 y SonarQube Community. Usa volúmenes con nombre propios del proyecto
# "nodebb-qa-sec", así que no toca los datos del ambiente del resto del equipo.
#
# Uso (desde qa/security):
#   docker compose up -d mongo sonarqube
#   docker compose run --rm -e SETUP=1 nodebb      # instalación no interactiva (solo la primera vez)
#   docker compose up -d nodebb
#
# NO ejecutar "docker compose down -v": borra la base de datos y las evidencias.
name: nodebb-qa-sec

services:
  mongo:
    image: mongo:7-jammy
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: nodebb
      MONGO_INITDB_ROOT_PASSWORD: nodebb
      MONGO_INITDB_DATABASE: nodebb
    volumes:
      - mongo-data:/data/db
      - ../../nodebb/NodeBB/install/docker/mongodb-user-init.js:/docker-entrypoint-initdb.d/user-init.js:ro

  nodebb:
    image: ghcr.io/nodebb/nodebb:4.16.7
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - '4567:4567'
    environment:
      # Valores para la instalación no interactiva (src/install.js, checkSetupFlagEnv).
      # Credenciales DE PRUEBA, solo para este ambiente local.
      NODEBB_URL: http://localhost:4567
      NODEBB_ADMIN_USERNAME: admin
      NODEBB_ADMIN_PASSWORD: 'QaAdmin#2026x'
      NODEBB_ADMIN_EMAIL: admin@example.org
      NODEBB_DB: mongo
      NODEBB_DB_HOST: mongo
      NODEBB_DB_PORT: '27017'
      NODEBB_DB_USER: nodebb
      NODEBB_DB_PASSWORD: nodebb
      NODEBB_DB_NAME: nodebb
    volumes:
      - nodebb-build:/usr/src/app/build
      - nodebb-uploads:/usr/src/app/public/uploads
      - nodebb-config:/opt/config

  sonarqube:
    image: sonarqube:community
    restart: unless-stopped
    ports:
      - '9000:9000'
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: 'true'
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs

volumes:
  mongo-data:
  nodebb-build:
  nodebb-uploads:
  nodebb-config:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:
