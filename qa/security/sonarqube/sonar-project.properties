# Análisis estático de NodeBB 4.16.7 con SonarQube Community.
# Se ejecuta con scripts/sonar-scan.sh (sonar-scanner-cli en Docker); la base del
# análisis es nodebb/NodeBB y estas rutas son relativas a esa carpeta.
sonar.projectKey=nodebb
sonar.projectName=NodeBB 4.16.7
sonar.projectVersion=4.16.7
sonar.sourceEncoding=UTF-8

# Código propio de NodeBB: servidor (src), cliente (public/src) e instalador.
sonar.sources=src,public/src,install,app.js,loader.js,require-main.js
sonar.tests=test

# Se excluyen dependencias de terceros, archivos generados, traducciones y la
# especificación OpenAPI: no son código mantenido por el proyecto.
sonar.exclusions=**/node_modules/**,build/**,public/vendor/**,public/language/**,public/openapi/**,**/*.min.js,install/docker/**,install/data/**
sonar.test.inclusions=test/**/*.js

# Cobertura de las pruebas unitarias (Mocha + nyc, mismos archivos que el pipeline de CI).
sonar.javascript.lcov.reportPaths=../../qa/security/sonarqube/coverage/lcov.info

# Detección de duplicados: se ignoran los archivos de pruebas.
sonar.cpd.exclusions=test/**
